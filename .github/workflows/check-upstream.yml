name: Check upstream DMRHub (quarterly)

# Three-month cadence, but GitHub disables schedules on repos with 60 days of
# inactivity. So the job runs monthly to keep the repo active; the real
# upstream comparison and build only happen once every 90 days.
#   - Monthly run  -> heartbeat commit, no upstream check, no build.
#   - 90-day run   -> compare upstream; build only if it moved.
# A manual dispatch always forces a full check (bypasses the 90-day gate) so
# the logic can be tested on demand.
on:
  schedule:
    # 03:00 UTC on the 1st of every month.
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      force_check:
        description: 'Force the upstream check regardless of the 90-day gate'
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: dmrhub-upstream-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read state
        id: state
        run: |
          SHA=$(jq -r '.last_built_sha // ""' .github/upstream-state.json)
          CHECKED=$(jq -r '.last_checked_at // ""' .github/upstream-state.json)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "checked=$CHECKED" >> "$GITHUB_OUTPUT"
          echo "上次构建对应上游：$SHA"
          echo "上次实质检查：$CHECKED"

      - name: Decide if this is a 90-day check
        id: gate
        env:
          FORCE: ${{ inputs.force_check }}
        run: |
          CHECKED="${{ steps.state.outputs.checked }}"
          echo "force=$FORCE"
          if [ "$FORCE" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "原因：手动强制检查"
            exit 0
          fi
          if [ -z "$CHECKED" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "原因：无历史检查记录"
            exit 0
          fi
          LAST_EPOCH=$(date -d "$CHECKED" +%s 2>/dev/null || echo 0)
          NOW_EPOCH=$(date +%s)
          DAYS=$(( (NOW_EPOCH - LAST_EPOCH) / 86400 ))
          echo "距上次实质检查 $DAYS 天"
          if [ "$DAYS" -ge 90 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "原因：已满 90 天"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "原因：未满 90 天，仅心跳保活"
          fi

      - name: Heartbeat (keep schedule alive)
        if: steps.gate.outputs.run == 'false'
        run: |
          jq --arg hb "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             '.last_heartbeat_at = $hb' .github/upstream-state.json > /tmp/state.json
          mv /tmp/state.json .github/upstream-state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/upstream-state.json
          git diff --cached --quiet || git commit -m "chore: upstream check heartbeat"
          git push
          echo "仓库保活完成；未到 90 天，不做上游比较与构建。"

      - name: Fetch upstream main HEAD
        if: steps.gate.outputs.run == 'true'
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(gh api repos/USA-RedDragon/DMRHub/commits/main --jq .sha)
          TAG=$(gh api repos/USA-RedDragon/DMRHub/releases/latest --jq .tag_name 2>/dev/null || true)
          [ -n "$SHA" ] || { echo "无法获取上游提交"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "上游最新提交：$SHA（$TAG）"

      - name: Decide whether to build
        if: steps.gate.outputs.run == 'true'
        id: decide
        run: |
          LAST="${{ steps.state.outputs.sha }}"
          NOW="${{ steps.upstream.outputs.sha }}"
          if [ -z "$LAST" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "原因：尚无构建记录"
          elif [ "$LAST" = "$NOW" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "原因：上游无更新，放弃构建，等待下次检查"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "原因：上游有更新（$LAST -> $NOW）"
          fi

      - name: No update - stop here
        if: steps.gate.outputs.run == 'true' && steps.decide.outputs.build == 'false'
        run: |
          jq --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             '.last_checked_at = $t | .last_heartbeat_at = $t' \
             .github/upstream-state.json > /tmp/state.json
          mv /tmp/state.json .github/upstream-state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/upstream-state.json
          git diff --cached --quiet || git commit -m "chore: upstream unchanged at ${{ steps.upstream.outputs.sha }}"
          git push
          echo "上游自上次构建以来没有变化，本次不编译，等待下一次检查。"

      - name: Record new upstream SHA
        if: steps.decide.outputs.build == 'true'
        run: |
          jq --arg sha "${{ steps.upstream.outputs.sha }}" \
             --arg tag "${{ steps.upstream.outputs.tag }}" \
             --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             '.last_built_sha = $sha | .last_built_release = $tag | .last_checked_at = $t | .last_heartbeat_at = $t' \
             .github/upstream-state.json > /tmp/state.json
          mv /tmp/state.json .github/upstream-state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/upstream-state.json
          git commit -m "chore: record upstream ${{ steps.upstream.outputs.sha }} for this build"
          git push

      - name: Trigger firmware build
        if: steps.decide.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "上游有更新，触发固件构建..."
          gh workflow run build-firmware.yml --repo "$GITHUB_REPOSITORY"
