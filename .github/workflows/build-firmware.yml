name: Build DMRHub x86_64 OpenWrt Firmware

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'DMRHub upstream tag/ref to build (blank = repo HEAD)'
        required: false
        default: ''
  push:
    tags:
      - 'fw-*'

concurrency:
  group: dmrhub-firmware-x86
  cancel-in-progress: false

permissions:
  contents: write

env:
  OP_VERSION: 24.10.8
  OP_TARGET: x86/64
  GO_VERSION: '1.27.3'
  NODE_VERSION: '26.13.0'
  TINYGO_VERSION: '0.43.0'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          REF="${{ github.event.inputs.upstream_ref }}"
          if [ -n "$REF" ]; then
            echo "Building requested ref: $REF"
          else
            echo "Building repo HEAD"
          fi
          SHORT=$(git rev-parse --short HEAD)
          BUILD_TAG="x86_64-${SHORT}"
          echo "build_tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd xz-utils curl ca-certificates build-essential

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ---- Frontend (zh-CN localization compiled into dist/) ----
      - name: Build frontend with Chinese localization
        working-directory: internal/http/frontend
        run: |
          npm ci
          echo "==> Running i18n consistency check"
          npm run i18n:check
          echo "==> Building Vue frontend"
          npm run build
          echo "==> Verifying Chinese strings in dist"
          grep -rl "认证失败\|用户名\|简体中文" dist/ | head -5 || true

      # ---- TinyGo for builtin WASM plugins ----
      - name: Install TinyGo
        run: |
          TDIR="$RUNNER_TEMP/tinygo"
          curl -fsSL -o "$TDIR.tar.gz" "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo${TINYGO_VERSION}.linux-amd64.tar.gz"
          mkdir -p "$TDIR"
          tar -xzf "$TDIR.tar.gz" -C "$TDIR" --strip-components=1
          echo "$TDIR/bin" >> "$GITHUB_PATH"
          export PATH="$TDIR/bin:$PATH"
          tinygo version

      - name: Generate builtin WASM module
        run: |
          export PATH="$RUNNER_TEMP/tinygo/bin:$PATH"
          go generate ./internal/plugins/builtin/...
          ls -lh internal/plugins/builtin/builtin.wasm.zst

      - name: Generate msgp serialization code
        run: |
          # Tarball source has no *_gen.go; msgp code is required to compile.
          go generate ./internal/db/models/...
          echo "==> generated files:"
          ls internal/db/models/*_gen.go

      # ---- Go backend (amd64 static binary) ----
      - name: Build DMRHub amd64 static binary
        run: |
          mkdir -p artifacts
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w -X main.version=${{ steps.ver.outputs.build_tag }} -X main.commit=${{ steps.ver.outputs.short_sha }}" \
            -o artifacts/dmrhub .
          file artifacts/dmrhub
          ls -lh artifacts/dmrhub

      # ---- Patch the LuCI "Backup / Flash Firmware" view with the OTA section ----
      - name: Add the DMRHub OTA section to the LuCI flash view
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          # Take the view from the same feed the image installs, then patch it.
          # The patch fails loudly when the view changes, so an upstream LuCI
          # update cannot silently drop the section.
          # The packages tree uses an underscore where the targets tree uses a
          # slash: packages/x86_64/luci, not packages/x86/64/luci.
          LUCI_FEED="https://downloads.openwrt.org/releases/${OP_VERSION}/packages/${OP_TARGET//\//_}/luci"
          curl -fsSL --retry 3 "$LUCI_FEED/Packages.gz" -o /tmp/luci-Packages.gz
          gunzip -f /tmp/luci-Packages.gz
          LUCIPKG=$(awk '/^Package: luci-mod-system$/ {found=1} found && /^Filename:/ {print $2; exit}' /tmp/luci-Packages)
          [ -n "$LUCIPKG" ] || { echo "luci-mod-system not found in the feed"; exit 1; }
          echo "==> $LUCI_FEED/$LUCIPKG"
          curl -fsSL --retry 3 "$LUCI_FEED/$LUCIPKG" -o /tmp/luci-mod-system.ipk
          rm -rf /tmp/luci-ipk && mkdir -p /tmp/luci-ipk
          tar -xzf /tmp/luci-mod-system.ipk -C /tmp/luci-ipk
          mkdir -p /tmp/luci-data && tar -xzf /tmp/luci-ipk/data.tar.gz -C /tmp/luci-data
          FLASH=/tmp/luci-data/www/luci-static/resources/view/system/flash.js
          [ -f "$FLASH" ] || { echo "flash.js not found in luci-mod-system"; exit 1; }
          mkdir -p openwrt/dmrhub/files/usr/share/dmrhub
          python3 openwrt/dmrhub/files/usr/share/dmrhub/patch-luci-flash.py \
            "$FLASH" \
            openwrt/dmrhub/files/usr/share/dmrhub/luci-dmrhub-ota.js \
            openwrt/dmrhub/files/usr/share/dmrhub/flash.js
          node --check openwrt/dmrhub/files/usr/share/dmrhub/flash.js 2>/dev/null \
            || python3 -c "print('node is unavailable; skipping the syntax check')"
          ls -lh openwrt/dmrhub/files/usr/share/dmrhub/flash.js

      # ---- Build ipk package ----
      - name: Build ipk package
        run: |
          set -eu
          PKG=openwrt/dmrhub
          mkdir -p "$PKG/files/usr/bin" "$PKG/files/usr/sbin"
          cp artifacts/dmrhub "$PKG/files/usr/bin/dmrhub"
          chmod +x "$PKG/files/etc/init.d/dmrhub" "$PKG/files/etc/init.d/dmrhub-data" "$PKG/files/etc/uci-defaults/99-dmrhub" "$PKG/files/usr/sbin/dmrhub-ota" "$PKG/files/usr/sbin/dmrhub-db-protect"
          chmod +x "$PKG/files/usr/bin/dmrhub"
          cd "$PKG"
          # Build a portable .ipk (ar archive with debian-binary + control.tar.gz + data.tar.gz)
          IPK_NAME="dmrhub_1.3.31-zh1_x86_64.ipk"
          TMP=$(mktemp -d)
          mkdir -p "$TMP/control" "$TMP/data"
          printf '2.0\n' > "$TMP/debian-binary"
          cat > "$TMP/control/control" <<EOF
          Package: dmrhub
          Version: 1.3.31-zh1
          Depends: ca-certificates, sqlite3-cli
          Architecture: x86_64
          Maintainer: 1083808255
          Description: DMRHub DMR network server (zh-CN localization build)
          EOF
          mkdir -p "$TMP/data/usr/bin"
          cp -a files/. "$TMP/data/"
          # The working directory is $PKG now, so use an absolute path.
          cp "$GITHUB_WORKSPACE/artifacts/dmrhub" "$TMP/data/usr/bin/dmrhub"
          (cd "$TMP/data" && tar -czf ../data.tar.gz .)
          (cd "$TMP/control" && tar -czf ../control.tar.gz .)
          # OpenWrt ipk = gzip-compressed tar, NOT Debian ar archive.
          mkdir -p "$TMP/pkg"
          cp "$TMP/debian-binary" "$TMP/control.tar.gz" "$TMP/data.tar.gz" "$TMP/pkg/"
          (cd "$TMP/pkg" && tar -czf "$GITHUB_WORKSPACE/artifacts/$IPK_NAME" .)
          echo "IPK_NAME=$IPK_NAME" >> "$GITHUB_ENV"
          file "$GITHUB_WORKSPACE/artifacts/$IPK_NAME"
          ls -lh "$GITHUB_WORKSPACE/artifacts/$IPK_NAME"

      # ---- Build full firmware image with ImageBuilder ----
      - name: Download OpenWrt ImageBuilder
        run: |
          set -eu
          IB="openwrt-imagebuilder-${OP_VERSION}-x86-64.Linux-x86_64.tar.zst"
          URL="https://downloads.openwrt.org/releases/${OP_VERSION}/targets/${OP_TARGET}/${IB}"
          echo "Downloading $URL"
          curl -fsSL --retry 3 "$URL" -o "$IB"
          tar --zstd -xf "$IB"
          echo "$PWD/openwrt-imagebuilder-${OP_VERSION}-x86-64.Linux-x86_64" > /tmp/ib_dir

      - name: Build firmware image with DMRHub preinstalled
        run: |
          set -eu
          IB_DIR=$(cat /tmp/ib_dir)
          cd "$IB_DIR"
          # ImageBuilder ships ipkg-make-index.sh; build a local feed for our ipk.
          mkdir -p local_packages
          cp "$GITHUB_WORKSPACE/artifacts/${IPK_NAME}" local_packages/
          # Generate the opkg Packages index directly (no OpenWrt-only helpers).
          IPK_FILE="$GITHUB_WORKSPACE/artifacts/${IPK_NAME}"
          IPK_SIZE=$(stat -c%s "$IPK_FILE")
          IPK_SHA=$(sha256sum "$IPK_FILE" | awk '{print $1}')
          cat > local_packages/Packages <<EOF
          Package: dmrhub
          Version: 1.3.31-zh1
          Depends: ca-certificates, sqlite3-cli
          Architecture: x86_64
          Maintainer: 1083808255
          Filename: ${IPK_NAME}
          Size: ${IPK_SIZE}
          SHA256sum: ${IPK_SHA}
          Description: DMRHub DMR network server (zh-CN localization build)

          EOF
          gzip -kf local_packages/Packages
          echo "==> local Packages:"; cat local_packages/Packages
          echo "src custom file:$(pwd)/local_packages" >> repositories.conf
          # Disable signature verification so the unsigned local feed is accepted.
          sed -i '/option check_signature/d' repositories.conf
          echo "==> repositories.conf:"; cat repositories.conf
          # Base set: LuCI web UI (Chinese) + DMRHub + certs. parted, resize2fs
          # and partx manage the data partition that init.d/dmrhub-data creates
          # on the free space of the disk at first boot.
          PACKAGES="dmrhub luci luci-base luci-theme-bootstrap luci-i18n-base-zh-cn luci-compat ca-certificates sqlite3-cli parted resize2fs partx-utils"
          # DMRHub binary is ~80MB. The boot partition only stages the small
          # configuration archive now that the database lives on its own data
          # partition, so 64 MB is plenty; the rootfs keeps 320 MB, of which
          # the squashfs (33 MB) covers the system and DMRHub, leaving around
          # 280 MB of overlay for packages. Everything left on the disk goes
          # to the DMRHub data partition at first boot.
          echo "==> make image PACKAGES=$PACKAGES KERNEL_PARTSIZE=64 ROOTFS_PARTSIZE=320"
          make image PROFILE="generic" PACKAGES="$PACKAGES" KERNEL_PARTSIZE=64 ROOTFS_PARTSIZE=320
          ls -lh bin/targets/x86/64/*.img.gz

      - name: Collect firmware artifacts
        run: |
          set -eu
          IB_DIR=$(cat /tmp/ib_dir)
          IMG=$(ls "$IB_DIR"/bin/targets/x86/64/*squashfs-combined.img.gz 2>/dev/null | head -1 || true)
          if [ -z "$IMG" ]; then
            IMG=$(ls "$IB_DIR"/bin/targets/x86/64/*.img.gz 2>/dev/null | head -1 || true)
          fi
          [ -n "$IMG" ] || { echo "No firmware image produced!"; exit 1; }
          FW_NAME="openwrt-${OP_VERSION}-x86-64-dmrhub-${{ steps.ver.outputs.build_tag }}-squashfs-combined.img.gz"
          cp "$IMG" "artifacts/$FW_NAME"
          echo "FW_NAME=$FW_NAME" >> "$GITHUB_ENV"
          cd artifacts
          sha256sum * > checksums.sha256
          ls -lh

      - name: Build the opkg feed index and sign it
        run: |
          set -eu
          cd artifacts
          # usign signs the feed so the image can keep "option check_signature"
          # enabled for every feed, including this one.
          if [ ! -x /usr/local/bin/usign ]; then
            git clone --depth 1 https://github.com/openwrt/usign.git /tmp/usign
            gcc -O2 -o /usr/local/bin/usign /tmp/usign/*.c
          fi
          echo "${{ secrets.OTA_SIGNING_KEY }}" > /tmp/dmrhub-ota.sec
          chmod 600 /tmp/dmrhub-ota.sec
          APP_SHA=$(sha256sum "${IPK_NAME}" | awk '{print $1}')
          APP_SIZE=$(stat -c%s "${IPK_NAME}")
          cat > Packages <<EOF
          Package: dmrhub
          Version: 1.3.31-zh1
          Depends: ca-certificates, sqlite3-cli
          Section: net
          Architecture: x86_64
          Installed-Size: 84000000
          Filename: ${IPK_NAME}
          Size: ${APP_SIZE}
          SHA256sum: ${APP_SHA}
          Description: DMRHub DMR network server (zh-CN localization build)

          EOF
          gzip -9kf Packages
          /usr/local/bin/usign -S -m Packages -s /tmp/dmrhub-ota.sec -m Packages > Packages.sig
          rm -f /tmp/dmrhub-ota.sec
          echo "=== Packages ==="; cat Packages
          echo "=== Packages.sig ==="; cat Packages.sig
          # The step runs inside artifacts, so verify against the absolute path.
          /usr/local/bin/usign -V -m Packages -p "$GITHUB_WORKSPACE/openwrt/dmrhub/files/etc/opkg/keys/21874afde7248b53"
          echo "signature verified"

      - name: Generate version.json for OTA
        run: |
          set -eu
          cd artifacts
          APP_SHA=$(sha256sum "${IPK_NAME}" | awk '{print $1}')
          FW_SHA=$(sha256sum "${FW_NAME}" | awk '{print $1}')
          # The release tag carries the run number, so the URLs in the
          # manifest point at the same release the assets are published to.
          TAG="fw-${{ steps.ver.outputs.build_tag }}-${{ github.run_number }}"
          cat > version.json <<EOF
          {
            "version": "1.3.31-zh1-${{ steps.ver.outputs.short_sha }}",
            "build_tag": "${{ steps.ver.outputs.build_tag }}",
            "release_tag": "$TAG",
            "upstream": "USA-RedDragon/DMRHub",
            "localization": "zh-CN",
            "openwrt": "${OP_VERSION}",
            "target": "${OP_TARGET}",
            "app_file": "${IPK_NAME}",
            "app_sha256": "$APP_SHA",
            "app_url": "https://github.com/1083808255/DMRHub-openwrt/releases/download/$TAG/${IPK_NAME}",
            "firmware_file": "${FW_NAME}",
            "firmware_sha256": "$FW_SHA",
            "firmware_url": "https://github.com/1083808255/DMRHub-openwrt/releases/download/$TAG/${FW_NAME}",
            "release_url": "https://github.com/1083808255/DMRHub-openwrt/releases/tag/$TAG",
            "feed_url": "https://github.com/1083808255/DMRHub-openwrt/releases/latest/download",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat version.json

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fw-${{ steps.ver.outputs.build_tag }}-${{ github.run_number }}
          name: "DMRHub x86_64 OpenWrt Firmware ${{ steps.ver.outputs.build_tag }}"
          body: |
            ## DMRHub x86_64 OpenWrt 固件（汉化版）

            - OpenWrt 基线：**${{ env.OP_VERSION }}** (${{ env.OP_TARGET }})
            - DMRHub：汉化版，简体中文界面
            - 源码提交：`${{ steps.ver.outputs.short_sha }}`

            ### 文件
            - `${{ env.FW_NAME }}` — 整机固件（squashfs-combined，预装 DMRHub），sysupgrade 直接刷
            - `${{ env.IPK_NAME }}` — DMRHub 应用包（可单独 opkg 更新）
            - `Packages` / `Packages.gz` / `Packages.sig` — opkg 软件源索引（usign 已签名）
            - `version.json` — OTA 清单
            - `checksums.sha256` — 校验和

            ### 使用
            ```
            sysupgrade -k <firmware.img.gz>    # -k 保留配置
            ```
            首次启动后配置在 `/opt/dmrhub/config.yaml`，Web 管理端口 3005。

            ### 在线更新
            固件已预置 DMRHub 软件源与签名公钥（`/etc/opkg/keys/21874afde7248b53`），
            在 LuCI「系统 → 软件包」中即可看到 DMRHub 并在线更新；
            「系统 → 更新与备份」页内也提供 DMRHub 固件 OTA。
          files: |
            artifacts/*.img.gz
            artifacts/*.ipk
            artifacts/Packages
            artifacts/Packages.gz
            artifacts/Packages.sig
            artifacts/version.json
            artifacts/checksums.sha256
          generate_release_notes: false

      - name: Publish to Gitee
        # The OTA script reads version.json from Gitee, because github.com is
        # unreachable from the networks these devices run on. A Gitee outage
        # must not lose a release GitHub already has, so the step reports its
        # failure without failing the build.
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: fw-${{ steps.ver.outputs.build_tag }}-${{ github.run_number }}
          # A runner reaches Gitee over a slow link; five minutes per large
          # asset is the budget before the manifest keeps the GitHub URL.
          GITEE_BIG_TIMEOUT: 300
        run: python3 .github/scripts/publish-gitee.py
